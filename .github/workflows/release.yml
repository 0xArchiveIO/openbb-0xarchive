name: Release

# Manual only. Publishes to PyPI through Trusted Publishing (no stored token),
# after a reviewer approves the `pypi` environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match pyproject.toml"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Version matches the request
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$actual" = "$REQUESTED" ] || { echo "::error::pyproject.toml is $actual, not $REQUESTED"; exit 1; }
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv build --build-constraint build-constraints.txt --require-hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/openbb-0xarchive/
    permissions:
      id-token: write # Trusted Publishing: PyPI exchanges this short-lived token, no stored secret
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Uploads with PEP 740 attestations, so PyPI shows which workflow built each file.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
