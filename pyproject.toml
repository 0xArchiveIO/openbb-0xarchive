[project]
name = "openbb-0xarchive"
version = "0.2.0"
description = "Hyperliquid and Lighter order books, trades, funding, liquidations and wallets from 0xArchive for the OpenBB Platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "0xArchive", email = "support@0xarchive.io" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "openbb-core>=2.0.0,<3.0.0",
    "openbb-crypto>=2.0.0,<3.0.0",
    "python-dateutil>=2.8",
]
keywords = ["openbb", "0xarchive", "hyperliquid", "lighter", "crypto", "market-data", "orderbook", "perpetuals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Full OpenBB, for the live tests, codegen/live_sweep.py and Workspace checks.
live = ["openbb>=4.4", "openbb-derivatives>=2,<3"]

[project.entry-points."openbb_provider_extension"]
oxarchive = "openbb_oxarchive:oxarchive_provider"

[project.entry-points."openbb_core_extension"]
oxarchive = "openbb_oxarchive.oxarchive_router:router"

[project.urls]
Homepage = "https://0xarchive.io"
Documentation = "https://docs.0xarchive.io/openbb"
Repository = "https://github.com/0xArchiveIO/openbb-0xarchive"
Issues = "https://github.com/0xArchiveIO/openbb-0xarchive/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_oxarchive"]
only-include = ["openbb_oxarchive"]
# Python source only, so a stray local file (notes, .env, keys) can never ship.
include = ["openbb_oxarchive/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["openbb_oxarchive/**/*.py", "tests/*.py", "codegen/*.py", "codegen/*.json", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "build-constraints.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real 0xArchive API (needs OXARCHIVE_API_KEY)"]
